name: Pasada de precios de relojes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      relojes:
        description: "Relojes a revisar en esta pasada"
        default: "70"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/test_radar.py
      - run: python scraper/test_validar_datos.py
      - run: python scraper/radar.py
        env:
          RADAR_BATCH: ${{ github.event.inputs.relojes || '70' }}
      - name: Validar datos antes de publicar
        run: python scraper/validar_datos.py
      - name: Guardar datos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Pasada $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
