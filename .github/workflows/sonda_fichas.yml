name: Sonda de fichas oficiales

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  estatico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/sonda_fichas.py static

  renderizado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.47.0
      - run: python -m playwright install --with-deps chromium
      - run: python scraper/sonda_fichas.py js
